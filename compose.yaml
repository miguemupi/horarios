services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      MIGRATIONS_DIR: /app/migrations
      TZ: ${APP_TIMEZONE:-Europe/Madrid}
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    init: true
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partes_serendipia}
      POSTGRES_USER: ${POSTGRES_USER:-partes_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb

volumes:
  postgres_data:
