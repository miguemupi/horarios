<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Registro digital de partes de trabajo de Factoría Serendipia" />
    <link rel="icon" type="image/png" href="/factoria-serendipia-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const saved = localStorage.getItem('serendipia-theme');
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <title>Partes de trabajo | Factoría Serendipia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
